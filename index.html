<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>JARVIS AI</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            height:100vh;
            overflow:hidden;

            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;

            background:
                radial-gradient(circle at center,
                #07131f 0%,
                #000814 50%,
                #000000 100%);

            font-family:Arial, Helvetica, sans-serif;
        }

        /* Animated Background */

        .stars{
            position:absolute;
            width:100%;
            height:100%;
            overflow:hidden;
            z-index:-2;
        }

        .stars span{
            position:absolute;
            display:block;
            width:3px;
            height:3px;
            background:white;
            border-radius:50%;
            animation:animateStars 10s linear infinite;
        }

        @keyframes animateStars{

            0%{
                transform:translateY(0px);
                opacity:1;
            }

            100%{
                transform:translateY(-1200px);
                opacity:0;
            }
        }

        /* Main Orb */

        .container{
            position:relative;
            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;
        }

        .orb{
            position:relative;

            width:260px;
            height:260px;

            border-radius:50%;

            background:
                radial-gradient(circle at 30% 30%,
                #7df9ff,
                #00c3ff,
                #002244);

            box-shadow:
                0 0 40px cyan,
                0 0 80px cyan,
                0 0 120px #00e5ff;

            animation:
                pulse 3s ease-in-out infinite,
                rotate 8s linear infinite;

            transform-style:preserve-3d;
        }

        .orb::before{
            content:"";

            position:absolute;
            inset:-15px;

            border-radius:50%;

            border:3px solid rgba(0,255,255,0.5);

            animation:spin 6s linear infinite;
        }

        .orb::after{
            content:"";

            position:absolute;

            width:100%;
            height:100%;

            border-radius:50%;

            background:
                radial-gradient(circle,
                rgba(255,255,255,0.8),
                transparent 60%);

            filter:blur(20px);
        }

        @keyframes pulse{

            0%{
                transform:scale(1);
            }

            50%{
                transform:scale(1.08);
            }

            100%{
                transform:scale(1);
            }
        }

        @keyframes rotate{

            0%{
                transform:rotateY(0deg);
            }

            100%{
                transform:rotateY(360deg);
            }
        }

        @keyframes spin{

            0%{
                transform:rotate(0deg);
            }

            100%{
                transform:rotate(360deg);
            }
        }

        /* Title */

        h1{
            margin-top:30px;

            font-size:55px;
            letter-spacing:8px;

            color:#00e5ff;

            text-shadow:
                0 0 10px cyan,
                0 0 20px cyan,
                0 0 40px cyan;
        }

        /* Buttons */

        .buttons{
            margin-top:40px;

            display:flex;
            gap:20px;
        }

        button{
            padding:15px 35px;

            border:none;
            border-radius:40px;

            font-size:18px;
            font-weight:bold;

            cursor:pointer;

            color:white;

            background:
                linear-gradient(45deg,
                #00bcd4,
                #2196f3);

            box-shadow:
                0 0 15px cyan;

            transition:0.3s;
        }

        button:hover{
            transform:scale(1.1);

            box-shadow:
                0 0 25px cyan,
                0 0 40px cyan;
        }

        /* Response Box */

        #response{
            margin-top:35px;

            width:80%;
            max-width:800px;

            min-height:80px;

            padding:20px;

            border-radius:20px;

            background:rgba(0,255,255,0.08);

            border:1px solid rgba(0,255,255,0.4);

            backdrop-filter:blur(10px);

            color:white;

            font-size:22px;
            text-align:center;

            box-shadow:
                0 0 20px rgba(0,255,255,0.3);
        }

        /* Listening Animation */

        .listening{
            animation:listeningGlow 1s infinite alternate;
        }

        @keyframes listeningGlow{

            from{
                box-shadow:
                    0 0 30px cyan,
                    0 0 60px cyan;
            }

            to{
                box-shadow:
                    0 0 60px #00e5ff,
                    0 0 120px #00e5ff;
            }
        }

    </style>

</head>

<body>

    <!-- Background Stars -->

    <div class="stars" id="stars"></div>

    <!-- Main -->

    <div class="container">

        <div class="orb" id="orb"></div>

        <h1>JARVIS</h1>

        <div class="buttons">

            <button onclick="startJarvis()">
                Start
            </button>

            <button onclick="stopJarvis()">
                Exit
            </button>

        </div>

        <div id="response">
            Waiting for command...
        </div>

    </div>

    <script>

        // Create Stars

        const stars = document.getElementById("stars");

        for(let i=0;i<120;i++){

            const star = document.createElement("span");

            star.style.left =
                Math.random() * window.innerWidth + "px";

            star.style.top =
                Math.random() * window.innerHeight + "px";

            star.style.animationDuration =
                (Math.random()*10 + 5) + "s";

            stars.appendChild(star);
        }

        // Speech

        function speak(text){

            const speech =
                new SpeechSynthesisUtterance(text);

            speech.rate = 1;
            speech.pitch = 1;

            speechSynthesis.speak(speech);
        }

        let active = false;

        function startJarvis(){

            active = true;

            document.getElementById(
                "response"
            ).innerHTML =
                "Jarvis Activated...";

            speak("Jarvis Activated");

            listenLoop();
        }

        function stopJarvis(){

            active = false;

            speak("Shutting down");

            document.getElementById(
                "response"
            ).innerHTML =
                "Jarvis Stopped";
        }

        // Continuous Listening Loop

        function listenLoop(){

            if(!active) return;

            const recognition =
                new webkitSpeechRecognition();

            recognition.lang = "en-IN";

            recognition.continuous = false;

            recognition.interimResults = false;

            const orb =
                document.getElementById("orb");

            orb.classList.add("listening");

            recognition.start();

            recognition.onresult =
            async function(event){

                const text =
                    event.results[0][0].transcript;

                document.getElementById(
                    "response"
                ).innerHTML =
                    "You: " + text;

                // Exit Voice Command

                if(
                    text.toLowerCase().includes("exit")
                    ||
                    text.toLowerCase().includes("stop")
                ){

                    stopJarvis();
                    return;
                }

                try{

                    const res = await fetch(
                        "http://127.0.0.1:5000/command",
                        {
                            method:"POST",

                            headers:{
                                "Content-Type":
                                "application/json"
                            },

                            body:JSON.stringify({
                                message:text
                            })
                        }
                    );

                    const data =
                        await res.json();

                    document.getElementById(
                        "response"
                    ).innerHTML =
                        "Jarvis: " + data.response;

                    speak(data.response);

                }catch(error){

                    document.getElementById(
                        "response"
                    ).innerHTML =
                        "Server Not Running";

                    speak("Server not running");
                }

            };

            recognition.onend = function(){

                orb.classList.remove("listening");

                // Restart Listening Again

                if(active){

                    setTimeout(()=>{
                        listenLoop();
                    },1000);

                }
            };

        }

    </script>

</body>

</html>
